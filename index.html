<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero on
      notched phones. Without it the bottom controls sit under the home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B1026" />
    <meta
      name="description"
      content="Roulette Lab - play the wheel on three layouts, place any of the fourteen bets, and watch the arithmetic that pays for them."
    />
    <title>Roulette Lab - Live table</title>
  </head>
  <body>
    <!--
      Boot element lives in the HTML, not in JS. If the bundle fails to load the
      player sees a styled message instead of a blank white page, which reads as
      "broken site" and gets the tab closed.
    -->
    <div id="app" class="boot" role="status" aria-live="polite">
      <p class="boot__brand">Roulette Lab</p>
      <p class="boot__msg">Loading&hellip;</p>
      <noscript>
        <p class="boot__msg">
          Roulette Lab needs JavaScript to run the table.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
