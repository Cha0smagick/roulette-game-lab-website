      <p class="boot__brand">REELAZO</p>
      <p class="boot__msg">Loading&hellip;</p>

        <p class="boot__msg">REELAZO needs JavaScript to render the tables.</p>

    </div>
    <script type="module" src="/src/encyclopedia.ts"></script>
